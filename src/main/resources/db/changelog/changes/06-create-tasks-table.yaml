databaseChangeLog:
  - changeSet:
      id: create-tasks-table
      author: freeman
      changes:
        - createTable:
            tableName: tasks
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: project_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: assignee_id
                  type: bigint

              - column:
                  name: created_by
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: varchar(255)

              - column:
                  name: priority
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false

              - column:
                  name: due_date
                  type: date

              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: false

              - column:
                  name: is_deleted
                  type: bit(1)
                  defaultValueBoolean: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: project_id
            referencedTableName: projects
            referencedColumnNames: id
            constraintName: fk_tasks_project

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: assignee_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tasks_assignee

        - addForeignKeyConstraint:
            baseTableName: tasks
            baseColumnNames: created_by
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_tasks_created_by