databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: freeman
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: username
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: first_name
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: bigint
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: datetime
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: datetime
                  constraints:
                    nullable: false

              - column:
                  name: is_deleted
                  type: bit(1)
                  defaultValueBoolean: 0
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_role